[package]
name = "jwt_claims_diff"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
hmac = "0.12"
josekit = { version = "0.10.3", default-features = false }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
jwt-simple = { version = "0.15.0", default-features = false, features = ["pure-rust"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
