[package]
name = "jwt-claims-diff"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Differential test of JWT claim and header validation (RFC 7519, 7515, 8725) in jsonwebtoken, jwt-simple and josekit"
publish = false

[lib]
name = "jwt_claims_diff"

[dependencies]
base64 = "0.22"
hmac = "0.12"
josekit = { version = "0.10.3", default-features = false }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
jwt-simple = { version = "0.15.0", default-features = false, features = ["pure-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
